[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgsentry"
version = "0.1.0"
description = "Health and security-posture checks for PostgreSQL on Kubernetes or Docker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "m1n1m0n0" }]
dependencies = [
    "psycopg[binary]>=3.1",
    "kubernetes>=29.0",
    "prometheus-client>=0.20",
    "click>=8.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Only needed when the backup marker lives in S3.
s3 = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "boto3>=1.34",
]

[project.scripts]
pgsentry = "pgsentry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pgsentry"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# asserts and hard-coded fake passwords are fine in tests
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["kubernetes.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
